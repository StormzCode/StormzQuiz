<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boards — StormzQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="index.html" class="logo">
      <svg class="bolt" viewBox="0 0 20 26" fill="currentColor"><path d="M11.5 0L1 15h7l-1.5 11L18 11h-7.5L11.5 0z"/></svg>
      <span class="storm">Stormz</span>Quiz
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="boards.html">Boards</a>
      <a href="papers.html">Past Papers</a>
    </div>
    <button class="settings-btn" id="settingsBtn" aria-label="Open settings">⚙️</button>
  </div>
</nav>

<main>
  <section class="section section-offset">
    <div class="container">
      <a href="boards.html" class="back-link is-hidden" id="backLink">← All boards</a>
      <div class="section-head">
        <h2 id="pageTitle">Choose your board</h2>
        <p id="pageSubtitle">Pick the exam board you're studying for, then pick a subject.</p>
      </div>

      <div class="subjects-grid" id="cardGrid"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">StormzQuiz — Exists for practice 👍.</div>
</footer>

<div class="settings-overlay" id="settingsOverlay"></div>
<aside class="settings-panel" id="settingsPanel" aria-label="Settings">
  <h3>Settings <button class="settings-close" id="settingsClose" aria-label="Close settings">&times;</button></h3>
  <div class="setting-row setting-row-column">
    <span>Theme</span>
    <div class="theme-swatches">
      <button type="button" class="theme-swatch" data-theme-value="light" aria-pressed="false">
        <span class="swatch-preview swatch-light"></span>
        <span class="swatch-label">Light</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="cosmic" aria-pressed="false">
        <span class="swatch-preview swatch-cosmic"></span>
        <span class="swatch-label">Cosmic</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="bloodmoon" aria-pressed="false">
        <span class="swatch-preview swatch-bloodmoon"></span>
        <span class="swatch-label">Bloodmoon</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="nature" aria-pressed="false">
        <span class="swatch-preview swatch-nature"></span>
        <span class="swatch-label">Nature</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="monochrome" aria-pressed="false">
        <span class="swatch-preview swatch-monochrome"></span>
        <span class="swatch-label">Monochrome</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="cherry" aria-pressed="false">
        <span class="swatch-preview swatch-cherry"></span>
        <span class="swatch-label">Cherry</span>
      </button>
      <button type="button" class="theme-swatch" data-theme-value="ocean" aria-pressed="false">
        <span class="swatch-preview swatch-ocean"></span>
        <span class="swatch-label">Ocean</span>
      </button>
    </div>
  </div>
  <div class="setting-row">
    <span>Reduce animations</span>
    <div class="switch" id="animSwitch" role="switch" aria-label="Reduce animations" aria-checked="false" tabindex="0"></div>
  </div>
  <div class="setting-row">
    <span>Sound effects</span>
    <div class="switch" id="soundSwitch" role="switch" aria-label="Sound effects" aria-checked="true" tabindex="0"></div>
  </div>
</aside>

<script src="questions.js"></script>
<script src="app.js"></script>
<script src="boards.js"></script>
</body>
</html>
